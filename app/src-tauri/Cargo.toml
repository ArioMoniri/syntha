[package]
name = "syntha"
version = "0.4.0"
description = "syntha — synthetic patient record generator (desktop)"
authors = ["Ariorad Moniri"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "syntha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
