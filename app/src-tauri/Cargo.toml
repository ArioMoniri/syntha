[package]
name = "syntha"
version = "0.5.7"
description = "syntha — synthetic patient record generator (desktop)"
authors = ["Ariorad Moniri"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.75"

# Single-binary desktop app (Tauri 2's recommended split into lib + bin is
# only needed if we ever target mobile; for now main.rs is self-contained).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
