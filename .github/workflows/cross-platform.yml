name: Cross-platform CI

# Runs the full Python test suite + an end-to-end generation smoke-test on
# macOS, Windows, and Linux every push / PR. The base `ci.yml` workflow keeps
# the Python-version matrix on Linux only for fast feedback; this workflow
# verifies the package works identically across operating systems.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: pytest -q --tb=short

      - name: End-to-end generation smoke (Bash, POSIX)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p data/raw
          # CI has no access to PHI-adjacent source CSVs; seed from the
          # committed 100-row sample so we still exercise the full pipeline.
          cp examples/sample_output/sample_episodes.csv data/raw/pristine_tolerant_episodes.csv
          python -m syntha.cli generate \
            --input data/raw/pristine_tolerant_episodes.csv \
            --output out/smoke \
            --n 50 --cohort tolerant --seed 7 \
            --fhir-format ndjson
          test -s out/smoke/synthetic_tolerant_episodes.csv
          test -s out/smoke/fhir/bundles.ndjson
          test -s out/smoke/validation_report.json
          test -s out/smoke/models/copula_tolerant/card.json
          echo "✓ end-to-end smoke passed"

      - name: End-to-end generation smoke (PowerShell, Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data/raw | Out-Null
          Copy-Item examples/sample_output/sample_episodes.csv data/raw/pristine_tolerant_episodes.csv
          python -m syntha.cli generate `
            --input data/raw/pristine_tolerant_episodes.csv `
            --output out/smoke `
            --n 50 --cohort tolerant --seed 7 `
            --fhir-format ndjson
          if (-not (Test-Path out/smoke/synthetic_tolerant_episodes.csv)) { throw "missing CSV" }
          if (-not (Test-Path out/smoke/fhir/bundles.ndjson))            { throw "missing FHIR" }
          if (-not (Test-Path out/smoke/validation_report.json))         { throw "missing report" }
          if (-not (Test-Path out/smoke/models/copula_tolerant/card.json)) { throw "missing card" }
          Write-Host "✓ end-to-end smoke passed"

      - name: Sanity-check generated CSV (row count + Friedewald + BP)
        shell: python
        run: |
          import pandas as pd
          df = pd.read_csv("out/smoke/synthetic_tolerant_episodes.csv")
          assert 1 <= len(df) <= 50, f"unexpected row count {len(df)}"
          if "bp_systolic" in df.columns and "bp_diastolic" in df.columns:
              both = df.dropna(subset=["bp_systolic", "bp_diastolic"])
              if len(both):
                  bad = (both["bp_systolic"] - both["bp_diastolic"]) < 20
                  assert not bad.any(), f"{bad.sum()} rows violate systolic >= diastolic + 20"
          print(f"OK — {len(df)} rows, {df.shape[1]} columns")

      - name: FHIR-bundle sanity check
        shell: python
        run: |
          import json
          from collections import Counter
          types = Counter()
          patients = 0
          with open("out/smoke/fhir/bundles.ndjson", encoding="utf-8") as f:
              for line in f:
                  bundle = json.loads(line)
                  assert bundle["resourceType"] == "Bundle"
                  for e in bundle["entry"]:
                      types[e["resource"]["resourceType"]] += 1
                      if e["resource"]["resourceType"] == "Patient":
                          patients += 1
          assert patients >= 1, "no Patient resources emitted"
          assert types.get("Observation", 0) >= 1, "no Observation resources emitted"
          print(f"OK — resources by type: {dict(types)}")

      - name: TS frontend build (Tauri app dry-run)
        shell: bash
        run: |
          cd app
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
          ls -lh dist/assets/ | head -10
          echo "✓ TS frontend builds cleanly on ${{ matrix.os }}"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Sanity-check toolchain (macOS shim defense)
        # The macos-latest runner image ships a `rustup-init` shim at
        # /usr/local/bin/{cargo,rustc} that intercepts bare invocations
        # and even rustup's own `rustc -vV` host-detection probe. Force
        # rustup to install + activate a real toolchain explicitly, then
        # put $CARGO_HOME/bin in front of PATH so subsequent steps see
        # the real binaries.
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          # Confirm the real binaries respond now:
          "$(rustup which cargo)" --version
          "$(rustup which rustc)" --version

      - name: Linux deps for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Cache cargo target (Swatinem)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
          key: cargo-check-${{ matrix.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          shared-key: tauri-check

      - name: cargo check (fast Rust type-check of the Tauri shell)
        # Use `rustup which cargo` to call the actual cargo proxy,
        # bypassing any rustup-init shim that may still be earlier on PATH.
        shell: bash
        run: "$(rustup which cargo)" check --manifest-path app/src-tauri/Cargo.toml
