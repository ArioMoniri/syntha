name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (with coverage)
        run: pytest -q --tb=short --cov=syntha --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: "py3.12-ubuntu"
          fail_ci_if_error: false   # Codecov outage shouldn't break CI
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Smoke-test CLI on the committed sample
        run: |
          python -m syntha.cli --version
          python -m syntha.cli fhir \
            --input examples/sample_output/sample_episodes.csv \
            --output /tmp/syntha_smoke \
            --format ndjson
          test -s /tmp/syntha_smoke/bundles.ndjson
          echo "✓ CLI smoke test passed"
