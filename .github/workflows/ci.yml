name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --tb=short

      - name: Smoke-test CLI on the committed sample
        run: |
          python -m syntha.cli --version
          python -m syntha.cli fhir \
            --input examples/sample_output/sample_episodes.csv \
            --output /tmp/syntha_smoke \
            --format ndjson
          test -s /tmp/syntha_smoke/bundles.ndjson
          echo "✓ CLI smoke test passed"
