name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-aarch64
            os: macos-14
            rust-target: aarch64-apple-darwin
            # Tauri 2 outputs under target/<triple>/release/bundle/<format>/
            bundle-dir: "app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
            bundle-glob: "syntha_*.dmg"
            release-name: "syntha_aarch64.dmg"
          - label: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle-dir: "app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
            bundle-glob: "syntha_*-setup.exe"
            release-name: "syntha_x64-setup.exe"
          - label: linux-amd64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundle-dir: "app/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage"
            bundle-glob: "syntha_*_amd64.AppImage"
            release-name: "syntha_amd64.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify bundled models are present
        shell: bash
        run: |
          # The committed app/src/model_*.json files are trained on the full
          # source cohorts (135k / 55k rows). CI does not have access to the
          # raw PHI-adjacent CSVs, so we ship the artifacts in-repo and
          # rebuild them via scripts/refresh_app_model.sh locally only.
          ls -lh app/src/model_tolerant.json app/src/model_strict.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install npm deps
        working-directory: app
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache cargo registry & target (Swatinem)
        # Smarter than raw actions/cache: keys on Cargo.lock + auto-restores
        # incremental builds, and prunes stale crates. Typical macOS Tauri
        # build drops from ~6 min to ~2 min on a warm cache.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"
          key: ${{ matrix.label }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          shared-key: tauri-build
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      # ── Windows Authenticode signing setup ──
      # When WINDOWS_CERTIFICATE (base64 of a .pfx) is set, decodes the cert
      # into a temporary file, imports it into the runner cert store, and
      # exports its SHA1 thumbprint via an env var that Tauri's bundler
      # reads. When the secret is absent the step no-ops and the .exe ships
      # unsigned (SmartScreen warning shown to users). End-to-end setup
      # documented in docs/WINDOWS_SIGNING.md.
      - name: Import Windows code-signing certificate
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certPath = Join-Path $env:RUNNER_TEMP "syntha-codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePwd = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePwd
          $thumbprint = $cert.Thumbprint
          Write-Host "✓ Imported certificate $thumbprint"
          "TAURI_BUNDLER_WINDOWS_CERTIFICATE_THUMBPRINT=$thumbprint" | Out-File -FilePath $env:GITHUB_ENV -Append
          Remove-Item $certPath -Force

      # ── macOS code signing setup ──
      # On macOS, import the Developer ID Application certificate from a GitHub
      # secret into a temporary keychain so codesign can find it during the
      # Tauri build. If the secret is absent the build proceeds **unsigned**
      # (and Gatekeeper will reject the resulting .app with the misleading
      # "damaged" error). Setup instructions in app/README.md.
      - name: Import Apple Developer ID certificate
        if: matrix.os == 'macos-14' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/syntha_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/syntha-build.keychain-db"

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain    -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "✓ Developer ID certificate imported"

      - name: Build Tauri app
        working-directory: app
        env:
          # When these env vars are set Tauri 2 automatically code-signs the
          # .app, then runs notarytool against $APPLE_ID + $APPLE_PASSWORD
          # ($APPLE_TEAM_ID) and staples the notarization ticket to the .dmg.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri 2 updater: when these are set + bundle.createUpdaterArtifacts
          # is true in tauri.conf.json, the build emits .tar.gz / .zip / .json
          # artifacts signed with the minisign private key. The .json files
          # are per-platform signature files; we still need to assemble the
          # top-level latest.json manifest after the build (next step).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri-build -- --target ${{ matrix.rust-target }}

      - name: Inspect produced bundle
        shell: bash
        run: |
          echo "Looking under: ${{ matrix.bundle-dir }}"
          ls -R "${{ matrix.bundle-dir }}" || true

      - name: Rename artifact to stable filename
        shell: bash
        run: |
          src=$(ls "${{ matrix.bundle-dir }}"/${{ matrix.bundle-glob }} | head -n1)
          test -n "$src" || { echo "no artifact matched ${{ matrix.bundle-dir }}/${{ matrix.bundle-glob }}"; exit 1; }
          mkdir -p release-assets
          cp "$src" "release-assets/${{ matrix.release-name }}"
          ls -lh release-assets/

      # ── Updater artifacts ──
      # Tauri 2 with createUpdaterArtifacts: true emits an extra updater
      # archive per platform (alongside the human-installer):
      #   macOS    bundle/macos/<name>.app.tar.gz  + .sig
      #   Linux    bundle/appimage/<name>.AppImage + .sig   (.AppImage is
      #            both the installer and the updater payload on Linux)
      #   Windows  bundle/nsis/<name>-setup.exe    + .sig   (signed in place)
      # The .sig is a minisign signature over the archive bytes. End users
      # only see installer files; the auto-updater fetches .sig + the archive
      # and verifies before installing.
      - name: Collect updater artifact + signature
        shell: bash
        run: |
          set -euo pipefail

          TARGET_ROOT="app/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          echo "── full bundle tree ──"
          ls -R "$TARGET_ROOT" || true

          case "${{ matrix.label }}" in
            macos-aarch64)
              src=$(ls "$TARGET_ROOT/macos"/*.app.tar.gz 2>/dev/null | head -n1) || true
              sig="${src}.sig"
              dest_archive="release-assets/syntha_aarch64.app.tar.gz"
              ;;
            windows-x64)
              src=$(ls "$TARGET_ROOT/nsis"/*-setup.exe 2>/dev/null | head -n1) || true
              sig="${src}.sig"
              dest_archive="release-assets/syntha_x64-setup.exe"
              ;;
            linux-amd64)
              src=$(ls "$TARGET_ROOT/appimage"/*.AppImage 2>/dev/null | head -n1) || true
              sig="${src}.sig"
              dest_archive="release-assets/syntha_amd64.AppImage"
              ;;
          esac

          if [[ -z "${src:-}" || ! -f "$src" ]]; then
            echo "✗ no updater artifact found"; exit 1
          fi
          if [[ ! -s "$sig" ]]; then
            echo "✗ updater signature missing or empty at $sig"
            echo "  (this means TAURI_SIGNING_PRIVATE_KEY didn't reach the build step)"
            ls -la "$(dirname "$sig")" | head -20
            exit 1
          fi

          cp "$src" "$dest_archive"
          cp "$sig" "${dest_archive}.sig"
          echo "✓ updater artifact: $dest_archive  ($(wc -c <"$dest_archive") bytes)"
          echo "✓ updater signature: ${dest_archive}.sig  ($(wc -c <"${dest_archive}.sig") bytes)"
          ls -lh release-assets/

      # On tag push: attach the renamed artifact to the matching GitHub
      # release. softprops/action-gh-release finds the release with tagName
      # equal to the pushed tag (creating it if missing) and uploads files
      # without overwriting an existing release body.
      - name: Upload to release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # Only attach files; do not overwrite the release's name / body /
          # draft flag. Whatever was previously authored (manually or via a
          # prior `gh release edit`) survives subsequent matrix jobs.
          # We attach the installer, the updater archive (same file for
          # Windows / Linux; .app.tar.gz on macOS), and the .sig.
          files: |
            release-assets/${{ matrix.release-name }}
            release-assets/*.sig
            release-assets/syntha_aarch64.app.tar.gz
          fail_on_unmatched_files: false

      # On manual workflow_dispatch: upload the artifact as a GitHub Actions
      # workflow artifact so we can verify the build end-to-end without
      # committing to a release. Downloadable from the run page for 90 days.
      - name: Upload workflow artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release-name }}
          path: release-assets/
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # latest.json — the Tauri updater manifest. Runs after the build
  # matrix finishes; downloads each platform's .sig from the release
  # we just populated, assembles the manifest, uploads it to the
  # release. End-user installs poll https://.../releases/latest/
  # download/latest.json (configured in tauri.conf.json).
  # ─────────────────────────────────────────────────────────────────
  manifest:
    name: Publish latest.json
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Wait for release assets to be available
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "Tag $TAG  Version $VERSION"

          # Download the three .sig files + the macOS app.tar.gz from the
          # release we just populated. The macOS bundle is delivered as a
          # tar.gz (the updater can't apply a .dmg); Windows uses the .exe
          # installer directly; Linux uses the .AppImage.
          mkdir -p sigs
          for asset in \
              syntha_aarch64.app.tar.gz syntha_aarch64.app.tar.gz.sig \
              syntha_x64-setup.exe.sig \
              syntha_amd64.AppImage.sig; do
            for attempt in 1 2 3 4 5; do
              if gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
                     -p "$asset" -D sigs --clobber 2>/dev/null; then
                echo "  ✓ $asset"
                break
              fi
              echo "  · $asset not ready (attempt $attempt) — waiting 10s"
              sleep 10
            done
            test -f "sigs/$asset" || { echo "✗ $asset never appeared"; exit 1; }
          done

          # Build latest.json. Schema per
          # https://v2.tauri.app/plugin/updater/#static-json-file
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mac_sig=$(cat sigs/syntha_aarch64.app.tar.gz.sig)
          win_sig=$(cat sigs/syntha_x64-setup.exe.sig)
          lin_sig=$(cat sigs/syntha_amd64.AppImage.sig)

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${mac_sig}",
                "url": "${base}/syntha_aarch64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${win_sig}",
                "url": "${base}/syntha_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${lin_sig}",
                "url": "${base}/syntha_amd64.AppImage"
              }
            }
          }
          EOF
          cat latest.json
          jq empty latest.json   # syntax check

      - name: Attach latest.json to the release
        uses: softprops/action-gh-release@v3
        with:
          files: latest.json
          fail_on_unmatched_files: true

      # ── SBOM generation ──
      # Software Bill of Materials in SPDX format. Many regulated environments
      # (some health-IT procurement teams, FDA-precert programs) require an
      # SBOM for every release. anchore/sbom-action runs syft against the repo
      # and writes spdx-json. Attached to the release as syntha-sbom.spdx.json.
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          artifact-name: syntha-sbom.spdx.json
          output-file: syntha-sbom.spdx.json

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v3
        with:
          files: syntha-sbom.spdx.json
          fail_on_unmatched_files: true

      # ── Install-button URL guard ──
      # The README install buttons all point at
      #     https://github.com/ArioMoniri/syntha/releases/latest/download/<FILE>
      # GitHub auto-redirects /latest/ to the most recent release, so as soon
      # as this workflow finishes the buttons resolve to *this* release's
      # assets. We assert that resolution actually works for all three
      # canonical filenames before the workflow exits successfully. If any
      # filename drifted or an upload was dropped, the release fails here
      # (not weeks later when a user clicks a 404 link).
      - name: Verify README install URLs resolve
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          REQUIRED=(
            "syntha_aarch64.dmg"
            "syntha_x64-setup.exe"
            "syntha_amd64.AppImage"
            "latest.json"
          )
          failed=0
          # GitHub's /latest/ redirect can take up to ~30s to update after a
          # release goes published, so retry briefly.
          for f in "${REQUIRED[@]}"; do
            url="$BASE/$f"
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -sIL -o /dev/null -w "%{http_code}" "$url" || true)
              if [[ "$code" == "200" ]]; then
                ok=1
                size=$(curl -sIL "$url" | awk '/content-length:/ {print $2}' | tail -1 | tr -d '\r')
                printf "  ✓ %-30s  HTTP %s   %s bytes\n" "$f" "$code" "${size:-?}"
                break
              fi
              printf "  · %-30s  HTTP %s   (attempt %d) — waiting 10s\n" "$f" "$code" "$attempt"
              sleep 10
            done
            [[ "$ok" == "1" ]] || { failed=$((failed+1)); echo "  ✗ $f never resolved"; }
          done
          if [[ "$failed" -gt 0 ]]; then
            echo "✗ $failed required install assets are missing from /latest/"
            exit 1
          fi
          echo "✓ all README install URLs resolve to this release"
