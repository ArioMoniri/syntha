name: Verify install buttons

# Daily external check that the install-button URLs in README.md actually
# resolve to live assets in the latest release. Catches:
#   - filename drift between README and release.yml (someone renames an asset)
#   - a release that didn't manage to upload one of the three artifacts
#   - GitHub-side anomalies that the release-time check inside release.yml
#     can't see (since release.yml only runs once per tag)
#
# When a check fails, this workflow opens (or reuses) a GitHub issue with
# the bad URL details, so the maintainer is paged automatically.

on:
  schedule:
    - cron: "17 8 * * *"   # 08:17 UTC every day — off-peak
  push:
    paths:
      - "README.md"
      - ".github/workflows/release.yml"
      - ".github/workflows/verify-install-buttons.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Discover install URLs from README
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          urls=$(grep -oE 'https://github\.com/[^"]+/releases/latest/download/[A-Za-z0-9._-]+' README.md \
                 | sort -u)
          echo "Found URLs:"
          echo "$urls" | sed 's/^/  /'
          {
            echo "urls<<EOF"
            echo "$urls"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: HEAD-check each URL
        id: check
        shell: bash
        run: |
          set -euo pipefail
          failed=""
          summary="| URL | HTTP | Bytes |\n|---|---|---|\n"
          while IFS= read -r url; do
            [[ -z "$url" ]] && continue
            code=$(curl -sIL -o /dev/null -w "%{http_code}" "$url" || echo "000")
            size=$(curl -sIL "$url" | awk '/content-length:/ {print $2}' | tail -1 | tr -d '\r')
            size="${size:-?}"
            if [[ "$code" == "200" ]]; then
              printf "  ✓ %s %s bytes  %s\n" "$code" "$size" "$url"
              summary+="| \`$url\` | $code ✓ | $size |\n"
            else
              printf "  ✗ %s %s\n" "$code" "$url"
              summary+="| \`$url\` | $code ✗ | — |\n"
              failed+="$url "
            fi
          done <<< "${{ steps.discover.outputs.urls }}"
          printf '%b' "$summary" > /tmp/summary.md
          echo "## Install-button verification" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          if [[ -n "$failed" ]]; then exit 1; fi

      - name: Open / update tracking issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const failed = `${{ steps.check.outputs.failed }}`.trim();
            const title = "[install-buttons] README download URLs are broken";
            const body = [
              "The daily verification workflow detected one or more README install-button",
              "URLs returning a non-200 HTTP status.",
              "",
              "**Failed URLs:**",
              "```",
              ...failed.split(/\s+/).filter(Boolean),
              "```",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Once the underlying release is fixed, this issue will be auto-closed on the",
              "next successful run.",
            ].join("\n");

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "install-buttons,automated",
            });
            if (existing.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["install-buttons", "automated", "bug"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            }

      - name: Auto-close tracking issue on success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "install-buttons,automated",
            });
            for (const issue of existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✓ All install-button URLs resolve again as of run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
